<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="不動産の相談">
  <!-- 背景（室内） -->
  <rect width="800" height="500" fill="#eef4fa"/>
  <rect x="0" y="360" width="800" height="140" fill="#dce8f2"/>
  <!-- 窓 -->
  <g>
    <rect x="60" y="60" width="220" height="180" rx="8" fill="#aed4f7"/>
    <rect x="60" y="60" width="220" height="180" rx="8" fill="none" stroke="#ffffff" stroke-width="8"/>
    <path d="M170 60v180M60 150h220" stroke="#ffffff" stroke-width="8"/>
    <!-- 窓外のビル -->
    <rect x="84" y="120" width="30" height="120" fill="#8cb8e0"/>
    <rect x="126" y="96" width="34" height="144" fill="#9ec9ee"/>
    <rect x="196" y="110" width="30" height="130" fill="#8cb8e0"/>
    <rect x="238" y="140" width="28" height="100" fill="#9ec9ee"/>
  </g>
  <!-- 観葉植物 -->
  <g>
    <rect x="702" y="300" width="44" height="60" rx="6" fill="#d7c4a8"/>
    <path d="M724 300 C 700 250, 700 220, 718 200 M724 300 C 748 246, 752 224, 736 198 M724 300 C 724 250, 716 230, 724 210" stroke="#7db877" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- テーブル -->
  <rect x="180" y="330" width="440" height="24" rx="10" fill="#c9a06a"/>
  <rect x="210" y="354" width="20" height="110" fill="#b58e5f"/>
  <rect x="570" y="354" width="20" height="110" fill="#b58e5f"/>
  <!-- 書類（家の図面） -->
  <g>
    <rect x="330" y="296" width="140" height="40" rx="4" fill="#ffffff" transform="rotate(-4 400 316)"/>
    <g transform="rotate(-4 400 316)">
      <path d="M352 326 l18 -14 18 14 v6 h-36 z" fill="#0e6fff"/>
      <path d="M392 314 h60 M392 322 h60 M392 330 h40" stroke="#c3d3e2" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 担当者（左） -->
  <g>
    <circle cx="270" cy="240" r="26" fill="#f2c9a0"/>
    <path d="M244 240 a26 26 0 0 1 52 0 v-14 a26 18 0 0 0 -52 0 z" fill="#3c3733"/>
    <rect x="238" y="266" width="64" height="70" rx="18" fill="#1b3a5c"/>
    <rect x="262" y="266" width="16" height="34" fill="#ffffff"/>
    <path d="M262 266 l8 12 8 -12" fill="#0e6fff"/>
    <!-- 腕（書類を指す） -->
    <rect x="292" y="284" width="52" height="16" rx="8" fill="#1b3a5c" transform="rotate(18 292 284)"/>
    <circle cx="342" cy="306" r="9" fill="#f2c9a0"/>
  </g>
  <!-- お客様（右・2名） -->
  <g>
    <circle cx="520" cy="244" r="24" fill="#f2c9a0"/>
    <path d="M496 240 a24 24 0 0 1 48 6 l-6 -20 a24 16 0 0 0 -40 -2 z" fill="#6b4a35"/>
    <rect x="490" y="268" width="60" height="68" rx="17" fill="#e0704a"/>
    <circle cx="590" cy="250" r="21" fill="#f2c9a0"/>
    <path d="M569 248 a21 21 0 0 1 42 0 v-10 a21 15 0 0 0 -42 0 z" fill="#8a8078"/>
    <rect x="563" y="271" width="54" height="65" rx="16" fill="#5b8a72"/>
  </g>
  <!-- 吹き出し（家マーク） -->
  <g>
    <rect x="404" y="150" width="120" height="88" rx="16" fill="#ffffff"/>
    <path d="M436 238 l10 20 16 -20 z" fill="#ffffff"/>
    <path d="M434 200 l30 -24 30 24 v26 h-60 z" fill="#0e6fff"/>
    <rect x="456" y="210" width="16" height="16" fill="#ffffff"/>
  </g>
</svg>
