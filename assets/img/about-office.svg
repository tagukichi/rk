<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="株式会社オフィスＲＫのオフィス">
  <!-- 空 -->
  <rect width="800" height="600" fill="url(#sky3)"/>
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc3f5"/>
      <stop offset="1" stop-color="#e3f1fd"/>
    </linearGradient>
  </defs>
  <!-- 雲 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="56" ry="18"/>
    <ellipse cx="180" cy="78" rx="38" ry="14"/>
    <ellipse cx="650" cy="120" rx="48" ry="16"/>
  </g>
  <!-- 奥のビル群 -->
  <g fill="#b9d4ec">
    <rect x="30" y="270" width="90" height="250"/>
    <rect x="140" y="230" width="70" height="290"/>
    <rect x="640" y="250" width="80" height="270"/>
    <rect x="730" y="300" width="70" height="220"/>
  </g>
  <!-- メインのオフィスビル -->
  <g>
    <rect x="280" y="140" width="240" height="380" fill="#f4f0e6"/>
    <rect x="280" y="140" width="240" height="16" fill="#e0d9c8"/>
    <!-- ガラス面 -->
    <rect x="300" y="176" width="200" height="250" fill="#9ec9ee"/>
    <g stroke="#ffffff" stroke-width="6" opacity="0.9">
      <path d="M300 226h200M300 276h200M300 326h200M300 376h200"/>
      <path d="M350 176v250M400 176v250M450 176v250"/>
    </g>
    <!-- 屋上サイン -->
    <rect x="330" y="96" width="140" height="44" rx="8" fill="#0f1c2e"/>
    <text x="400" y="127" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">RK</text>
    <!-- エントランス -->
    <rect x="360" y="446" width="80" height="74" fill="#1b3a5c"/>
    <rect x="396" y="446" width="6" height="74" fill="#cfe6fb"/>
    <rect x="330" y="436" width="140" height="10" fill="#e0d9c8"/>
  </g>
  <!-- 手前の低層ビル -->
  <g>
    <rect x="550" y="360" width="150" height="160" fill="#e8e2d4"/>
    <g fill="#9ec9ee">
      <rect x="568" y="380" width="32" height="26"/>
      <rect x="616" y="380" width="32" height="26"/>
      <rect x="568" y="424" width="32" height="26"/>
      <rect x="616" y="424" width="32" height="26"/>
      <rect x="568" y="468" width="32" height="26"/>
      <rect x="616" y="468" width="32" height="26"/>
    </g>
  </g>
  <g>
    <rect x="110" y="390" width="140" height="130" fill="#dde8f2"/>
    <g fill="#9ec9ee">
      <rect x="128" y="410" width="30" height="24"/>
      <rect x="174" y="410" width="30" height="24"/>
      <rect x="128" y="450" width="30" height="24"/>
      <rect x="174" y="450" width="30" height="24"/>
    </g>
  </g>
  <!-- 地面 -->
  <rect x="0" y="520" width="800" height="80" fill="#dcecdc"/>
  <path d="M0 534 H800" stroke="#c4dcc4" stroke-width="4" stroke-dasharray="24 18"/>
  <!-- 樹木 -->
  <g>
    <rect x="80" y="486" width="12" height="38" fill="#b58e5f"/>
    <circle cx="86" cy="468" r="32" fill="#a8d8a0"/>
    <rect x="524" y="492" width="10" height="32" fill="#b58e5f"/>
    <circle cx="529" cy="478" r="26" fill="#98cf90"/>
    <rect x="716" y="490" width="10" height="32" fill="#b58e5f"/>
    <circle cx="721" cy="476" r="28" fill="#a8d8a0"/>
  </g>
</svg>
