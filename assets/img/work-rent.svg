<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="住み替えのサポート">
  <!-- 空 -->
  <rect width="800" height="500" fill="url(#sky2)"/>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc3f5"/>
      <stop offset="1" stop-color="#e3f1fd"/>
    </linearGradient>
  </defs>
  <!-- 雲 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="80" rx="52" ry="18"/>
    <ellipse cx="185" cy="70" rx="36" ry="14"/>
    <ellipse cx="620" cy="60" rx="46" ry="16"/>
  </g>
  <!-- 奥の街並み -->
  <g fill="#b9d4ec">
    <rect x="20" y="230" width="60" height="190"/>
    <rect x="100" y="260" width="70" height="160"/>
    <rect x="700" y="240" width="70" height="180"/>
  </g>
  <!-- 新居（一戸建て） -->
  <g>
    <rect x="470" y="240" width="200" height="180" fill="#f4f0e6"/>
    <polygon points="450,250 570,150 690,250" fill="#e0704a"/>
    <rect x="642" y="170" width="26" height="60" fill="#e0704a"/>
    <!-- ドア・窓 -->
    <rect x="540" y="330" width="52" height="90" fill="#1b3a5c"/>
    <circle cx="582" cy="378" r="4" fill="#f0c75e"/>
    <rect x="492" y="270" width="42" height="38" fill="#9ec9ee"/>
    <rect x="608" y="270" width="42" height="38" fill="#9ec9ee"/>
    <rect x="492" y="284" width="42" height="6" fill="#ffffff" opacity="0.8"/>
    <rect x="608" y="284" width="42" height="6" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- 引っ越しトラック -->
  <g>
    <rect x="130" y="300" width="200" height="96" rx="8" fill="#ffffff"/>
    <rect x="130" y="300" width="200" height="96" rx="8" fill="none" stroke="#cddcea" stroke-width="3"/>
    <rect x="330" y="330" width="74" height="66" rx="8" fill="#0e6fff"/>
    <rect x="342" y="340" width="36" height="26" rx="4" fill="#cfe6fb"/>
    <circle cx="190" cy="404" r="26" fill="#1b3a5c"/>
    <circle cx="190" cy="404" r="11" fill="#e8eef4"/>
    <circle cx="356" cy="404" r="26" fill="#1b3a5c"/>
    <circle cx="356" cy="404" r="11" fill="#e8eef4"/>
    <!-- 荷箱アイコン -->
    <rect x="196" y="326" width="44" height="44" fill="#e8b25c"/>
    <path d="M196 348h44" stroke="#c99440" stroke-width="4"/>
    <path d="M218 326v44" stroke="#c99440" stroke-width="4"/>
  </g>
  <!-- 家族（シンプル人物） -->
  <g>
    <!-- 大人1 -->
    <circle cx="712" cy="330" r="14" fill="#f2c9a0"/>
    <rect x="700" y="344" width="24" height="46" rx="10" fill="#0e6fff"/>
    <!-- 大人2 -->
    <circle cx="748" cy="336" r="12" fill="#f2c9a0"/>
    <rect x="737" y="348" width="22" height="42" rx="10" fill="#e0704a"/>
    <!-- 子ども -->
    <circle cx="734" cy="368" r="9" fill="#f2c9a0"/>
    <rect x="726" y="377" width="16" height="26" rx="7" fill="#f0c75e"/>
  </g>
  <!-- 地面 -->
  <rect x="0" y="420" width="800" height="80" fill="#dcecdc"/>
  <path d="M0 430 H800" stroke="#c4dcc4" stroke-width="4" stroke-dasharray="24 18"/>
  <!-- 樹木 -->
  <g>
    <rect x="60" y="392" width="10" height="32" fill="#b58e5f"/>
    <circle cx="65" cy="378" r="26" fill="#a8d8a0"/>
    <rect x="438" y="396" width="8" height="28" fill="#b58e5f"/>
    <circle cx="442" cy="384" r="22" fill="#98cf90"/>
  </g>
</svg>
